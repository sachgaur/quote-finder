[project]
name = "youtube-quote-finder"
version = "0.1.0"
description = "Find memorable, source-verifiable quotes in YouTube captions."
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "httpx>=0.28,<1",
  "python-dotenv>=1,<2", "youtube-transcript-api>=1.2,<2", "redis>=5,<9"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.vercel]
entrypoint = "main:app"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]
